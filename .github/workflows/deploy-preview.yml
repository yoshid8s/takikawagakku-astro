name: Deploy Preview

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-takikawagakku-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Use preview htaccess
        run: cp deployment/preview.htaccess dist/.htaccess

      - name: Use preview robots.txt
        run: cp deployment/preview-robots.txt dist/robots.txt

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Test SSH connection
        env:
          SSHPASS: ${{ secrets.SAKURA_PASSWORD }}
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_SSH_PORT: ${{ secrets.SAKURA_SSH_PORT }}
          SAKURA_USERNAME: ${{ secrets.SAKURA_USERNAME }}
        run: |
          sshpass -e ssh \
            -p "$SAKURA_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$SAKURA_USERNAME@$SAKURA_HOST" \
            'echo "SSH connection successful"'

      - name: Synchronize preview files to Sakura
        env:
          SSHPASS: ${{ secrets.SAKURA_PASSWORD }}
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_SSH_PORT: ${{ secrets.SAKURA_SSH_PORT }}
          SAKURA_USERNAME: ${{ secrets.SAKURA_USERNAME }}
          SAKURA_PREVIEW_DEPLOY_PATH: ${{ secrets.SAKURA_PREVIEW_DEPLOY_PATH }}
        run: >
          sshpass -e rsync -az --checksum --no-times --itemize-changes
          -e "ssh -p $SAKURA_SSH_PORT -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          dist/
          "$SAKURA_USERNAME@$SAKURA_HOST:$SAKURA_PREVIEW_DEPLOY_PATH/"
